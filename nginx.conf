user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # WebSocket 업그레이드 헤더 처리
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream julia_frontend {
        server frontend:3000;
    }

    upstream julia_backend {
        server backend:8080;
    }

    upstream julia_file_processor {
        server file-processor:5001;
    }

    # --- 80 포트: ACME 챌린지 서빙 + 나머지는 HTTPS 리다이렉트 ---
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name hapcky.me www.hapcky.me;

        # ACME 인증 파일은 반드시 여기서 200으로 응답되어야 함
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
            allow all;
        }

        # 그 외 모든 요청은 HTTPS로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- 443 포트: 실제 서비스 (인증서 발급 후 사용) ---
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name hapcky.me www.hapcky.me;

        ssl_certificate     /etc/letsencrypt/live/hapcky.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hapcky.me/privkey.pem;

        # (선택) TLS 정책
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # 프런트엔드 (SvelteKit 등 정적 자산)
        location / {
            proxy_pass http://julia_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket/SSR 대비
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # 백엔드 API
        location /api/ {
            proxy_pass http://julia_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 파일 처리 서버 API
        location /file-processor/ {
            proxy_pass http://julia_file_processor/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 파일 업로드를 위한 설정
            client_max_body_size 20M;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # 정적 파일(프런트 컨테이너가 /static 제공 시)
        location /static/ {
            proxy_pass http://julia_frontend/static/;
            access_log off;
            expires 7d;
        }
    }
}
